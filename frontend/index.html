<!DOCTYPE html>
<html lang="ua">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitRPG - Трекер Звичок</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <header class="profile-header">
            <div class="avatar-container">
                <div class="avatar-placeholder">🧙‍♂️</div>
                <div class="level-badge">Рівень <span id="hero-level">1</span></div>
            </div>
            
            <div class="stats-container">
                <h2 class="hero-name">Мій Герой</h2>
                
                <div class="stat-bar-container">
                    <span class="stat-label">Досвід (XP): <span id="xp-text">30/100</span></span>
                    <div class="bar-outer">
                        <div id="xp-bar-inner" class="bar-inner xp-color" style="width: 30%;"></div>
                    </div>
                </div>
            </div>

            <div class="gold-container">
                <span class="gold-icon">💰</span>
                <span id="gold-count" class="gold-value">150</span>
            </div>
        </header>

        <main class="main-content">
            
            <section class="column-section habits-section">
                <div class="section-header">
                    <h3>⚔️ Мої Звички</h3>
                    <button id="add-habit-btn" class="btn btn-primary">➕ Додати звичку</button>
                </div>

                <div id="habits-list" class="cards-list">
                    
                    <div class="card habit-card" data-id="1">
                        <div class="card-info">
                            <h4 class="card-title">Ранкова зарядка 15 хв</h4>
                            <span class="badge badge-easy">Легка</span>
                        </div>
                        <div class="card-actions">
                            <button class="action-btn btn-success" title="Виконано">✓</button>
                            <button class="action-btn btn-danger" title="Пропущено">✗</button>
                            <button class="action-btn btn-delete" title="Видалити">🗑</button>
                        </div>
                    </div>

                    <div class="card habit-card" data-id="2">
                        <div class="card-info">
                            <h4 class="card-title">Вчити Python (FastAPI)</h4>
                            <span class="badge badge-hard">Важка</span>
                        </div>
                        <div class="card-actions">
                            <button class="action-btn btn-success" title="Виконано">✓</button>
                            <button class="action-btn btn-danger" title="Пропущено">✗</button>
                            <button class="action-btn btn-delete" title="Видалити">🗑</button>
                        </div>
                    </div>

                </div>
            </section>

            <section class="column-section shop-section">
                <div class="section-header">
                    <h3>🏪 Крамниця Нагород</h3>
                    <button id="add-reward-btn" class="btn btn-secondary">➕ Додати нагороду</button>
                </div>

                <div id="rewards-list" class="cards-list">
                    
                    <div class="card reward-card" data-id="101">
                        <div class="card-info">
                            <h4 class="card-title">Пограти в ігри 1 годину</h4>
                            <div class="reward-cost">💰 50 монет</div>
                        </div>
                        <button class="btn btn-buy">Придбати</button>
                    </div>

                    <div class="card reward-card" data-id="102">
                        <div class="card-info">
                            <h4 class="card-title">З'їсти смачну піцу</h4>
                            <div class="reward-cost">💰 120 монет</div>
                        </div>
                        <button class="btn btn-buy">Придбати</button>
                    </div>

                </div>
            </section>

        </main>

        <div id="habit-modal" class="modal-overlay hidden">
            <div class="modal-window">
                <h4>Створення нової звички</h4>
                <form id="habit-form">
                    <div class="form-group">
                        <label for="habit-title">Назва звички:</label>
                        <input type="text" id="habit-title" placeholder="Наприклад: Пити воду" required>
                    </div>
                    <div class="form-group">
                        <label for="habit-difficulty">Складність (впливає на нагороду):</label>
                        <select id="habit-difficulty">
                            <option value="easy">Легка (+10 XP)</option>
                            <option value="medium">Середня (+20 XP)</option>
                            <option value="hard">Важка (+40 XP)</option>
                        </select>
                    </div>
                    <div class="modal-buttons">
                        <button type="button" id="modal-cancel-btn" class="btn btn-secondary">Скасувати</button>
                        <button type="submit" class="btn btn-primary">Зберегти</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

</body>
</html>
